[project]
name = "blt-patching-visualizer"
version = "0.1.0"
description = "An animated educational UI for Byte Latent Transformer patching"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gradio>=5.49,<7",
    "manim>=0.20,<0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

